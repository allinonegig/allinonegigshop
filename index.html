<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>AllInOneGig Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d10;
    --surface: #12151a;
    --surface-2: #181c23;
    --line: #232832;
    --text: #eef0f3;
    --muted: #8a919c;
    --faint: #5d6470;
    --accent: #5b8cff;
    --accent-soft: rgba(91, 140, 255, .12);
    --ok: #3ccf91;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; }
  body { padding: 0 16px calc(100px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  svg { display: block; }
  .num { font-variant-numeric: tabular-nums; }

  /* top bar */
  .top { display: flex; align-items: center; gap: 10px; padding: 16px 0 6px; }
  .mark { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center;
    background: linear-gradient(145deg, #6f9bff, #3d6cf0); color: #fff; font-weight: 700; font-size: 14px; }
  .brand { font-weight: 600; letter-spacing: -.2px; }
  .brand small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; margin-top: -2px; }

  /* hero */
  .hero { padding: 22px 0 6px; }
  .hero h1 { margin: 0; font-size: 26px; line-height: 1.2; letter-spacing: -.6px; font-weight: 700; }
  .hero p { margin: 8px 0 0; color: var(--muted); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); margin: 18px 0 4px;
    border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .stat { padding: 11px 12px; background: var(--surface); }
  .stat + .stat { border-left: 1px solid var(--line); }
  .stat b { display: block; font-size: 14px; font-weight: 600; }
  .stat span { color: var(--muted); font-size: 12px; }

  /* sections & cards */
  .label { margin: 26px 0 10px; color: var(--faint); font-size: 12px; font-weight: 600;
    letter-spacing: .8px; text-transform: uppercase; }
  .card { width: 100%; display: flex; align-items: center; gap: 14px; padding: 16px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    margin-bottom: 10px; transition: border-color .15s, background .15s; }
  .card:active { background: var(--surface-2); border-color: #2e3542; }
  .ico { width: 40px; height: 40px; flex: none; border-radius: 10px; display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent); }
  .card .body { flex: 1; min-width: 0; }
  .card .t { font-weight: 600; letter-spacing: -.1px; }
  .card .s { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .card .p { flex: none; text-align: right; }
  .card .p b { display: block; font-weight: 600; }
  .card .p span { color: var(--faint); font-size: 11.5px; }
  .chev { color: var(--faint); flex: none; }

  /* page header */
  .bar { display: flex; align-items: center; gap: 10px; padding: 14px 0 4px; min-height: 56px; }
  .back { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); display: grid; place-items: center; }
  .bar h2 { margin: 0; font-size: 18px; letter-spacing: -.3px; font-weight: 600; }
  .lead { color: var(--muted); margin: 2px 0 16px; }

  /* country tiles */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; display: flex; align-items: center; gap: 10px; transition: background .15s; }
  .tile:active { background: var(--surface-2); }
  .tile .f { font-size: 22px; line-height: 1; }
  .tile .n { font-weight: 500; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* search & list */
  .search { position: sticky; top: 0; z-index: 3; background: var(--bg); padding: 6px 0 2px; }
  .field { position: relative; }
  .field svg { position: absolute; left: 13px; top: 13px; color: var(--faint); }
  .field input { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--surface); color: var(--text); font: inherit; padding: 0 14px 0 40px; outline: none; }
  .field input::placeholder { color: var(--faint); }
  .field input:focus { border-color: var(--accent); }
  .list { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
  .row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 14px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row:active { background: var(--surface-2); }
  .row .f { font-size: 20px; }
  .row .n { flex: 1; }
  .letter { color: var(--faint); font-size: 12px; font-weight: 600; margin: 16px 2px 6px; }
  .empty { color: var(--muted); text-align: center; padding: 34px 0; }

  /* product detail */
  .product { padding: 10px 0 4px; display: flex; gap: 14px; align-items: center; }
  .badge { width: 56px; height: 56px; border-radius: 16px; flex: none; display: grid; place-items: center;
    background: var(--surface); border: 1px solid var(--line); font-size: 30px; color: var(--accent); }
  .product h1 { margin: 0; font-size: 20px; letter-spacing: -.4px; line-height: 1.25; }
  .product .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .price { margin: 18px 0 4px; display: flex; align-items: baseline; gap: 8px; }
  .price b { font-size: 30px; letter-spacing: -.8px; font-weight: 700; }
  .price span { color: var(--muted); font-size: 13px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; margin-top: 12px; }
  .panel h3 { margin: 0 0 10px; font-size: 13px; color: var(--faint); font-weight: 600;
    text-transform: uppercase; letter-spacing: .8px; }
  .panel p { margin: 0; color: #c9ced6; }
  .feat { display: flex; gap: 10px; align-items: flex-start; margin-top: 10px; color: #c9ced6; }
  .feat svg { color: var(--ok); flex: none; margin-top: 3px; }
  .steps { margin: 0; padding: 0; list-style: none; }
  .steps li { position: relative; padding: 0 0 14px 30px; color: #c9ced6; }
  .steps li:last-child { padding-bottom: 0; }
  .steps li::before { content: ""; position: absolute; left: 7px; top: 6px; width: 9px; height: 9px;
    border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .steps li:not(:last-child)::after { content: ""; position: absolute; left: 11px; top: 19px; bottom: 2px;
    width: 1px; background: var(--line); }
  .steps b { color: var(--text); font-weight: 600; }
  .note { color: var(--faint); font-size: 12.5px; text-align: center; margin: 22px 0 0; }

  /* in-page buy button: used outside Telegram and as a fallback */
  .buy { position: fixed; left: 16px; right: 16px; bottom: calc(14px + env(safe-area-inset-bottom));
    max-width: 528px; margin: 0 auto; height: 52px; border-radius: 13px; background: var(--accent);
    color: #fff; font-weight: 600; text-align: center; display: none; z-index: 5; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom));
    max-width: 528px; margin: 0 auto; padding: 12px 14px; border-radius: 12px; background: #1f2530;
    border: 1px solid var(--line); color: var(--text); font-size: 14px; opacity: 0; transform: translateY(8px);
    transition: .2s; pointer-events: none; z-index: 6; }
  .toast.show { opacity: 1; transform: none; }
  .view { animation: in .2s ease; }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="app"></div>
<button class="buy" id="buyBtn"></button>
<div class="toast" id="toast"></div>

<script>
/* ======================= EDIT TEXT HERE =======================
   Prices and countries come from bot.py automatically.
   Names and descriptions below are what customers see on this page. */
const SHOP = {
  name: "AllInOneGig",
  tagline: "Proxy & digital services",
  headline: "Static proxies and digital services, delivered in Telegram.",
  intro: "Pay with USDT on BEP20. Your order arrives right here in your chat.",
  names: {
    mob: "Static mobile proxy",
    res: "Static residential proxy",
    idv: "ID verification service",
    test: "TEST - payment check",
  },
  short: {
    mob: "Real mobile carrier IPs",
    res: "Real home ISP IPs, any country",
    idv: "Help verifying your own identity",
    test: "Only you can see this",
  },
  desc: {
    mob: c => [`A static IP address from a real mobile network in ${c}.`,
      ["Mobile IPs have the highest trust on social media and app platforms",
       "The IP stays the same for your sessions",
       "Delivered in your Telegram chat once payment is confirmed"]],
    res: c => [`Your own static residential IP address in ${c}, from a real home internet provider.`,
      ["The IP stays the same, so your sessions look consistent",
       "Residential IPs are trusted by most websites and apps",
       "Delivered in your Telegram chat once payment is confirmed"]],
    idv: () => ["Get help verifying your own identity on a platform.",
      ["After payment, the bot asks for the country you're from and a clear photo of your face",
       "The seller then guides you through the rest in chat"]],
    test: () => ["Admin-only test product to check payments end to end.", []],
  },
};
/* ============================================================== */

const COUNTRIES = {"AF":"Afghanistan","AL":"Albania","DZ":"Algeria","AD":"Andorra","AO":"Angola","AG":"Antigua and Barbuda","AR":"Argentina","AM":"Armenia","AU":"Australia","AT":"Austria","AZ":"Azerbaijan","BS":"Bahamas","BH":"Bahrain","BD":"Bangladesh","BB":"Barbados","BY":"Belarus","BE":"Belgium","BZ":"Belize","BJ":"Benin","BT":"Bhutan","BO":"Bolivia","BA":"Bosnia and Herzegovina","BW":"Botswana","BR":"Brazil","BN":"Brunei","BG":"Bulgaria","BF":"Burkina Faso","BI":"Burundi","KH":"Cambodia","CM":"Cameroon","CA":"Canada","CV":"Cape Verde","CF":"Central African Republic","TD":"Chad","CL":"Chile","CN":"China","CO":"Colombia","KM":"Comoros","CG":"Congo","CD":"DR Congo","CR":"Costa Rica","CI":"Cote d'Ivoire","HR":"Croatia","CU":"Cuba","CY":"Cyprus","CZ":"Czech Republic","DK":"Denmark","DJ":"Djibouti","DM":"Dominica","DO":"Dominican Republic","EC":"Ecuador","EG":"Egypt","SV":"El Salvador","GQ":"Equatorial Guinea","ER":"Eritrea","EE":"Estonia","SZ":"Eswatini","ET":"Ethiopia","FJ":"Fiji","FI":"Finland","FR":"France","GA":"Gabon","GM":"Gambia","GE":"Georgia","DE":"Germany","GH":"Ghana","GR":"Greece","GD":"Grenada","GT":"Guatemala","GN":"Guinea","GW":"Guinea-Bissau","GY":"Guyana","HT":"Haiti","HN":"Honduras","HK":"Hong Kong","HU":"Hungary","IS":"Iceland","IN":"India","ID":"Indonesia","IR":"Iran","IQ":"Iraq","IE":"Ireland","IL":"Israel","IT":"Italy","JM":"Jamaica","JP":"Japan","JO":"Jordan","KZ":"Kazakhstan","KE":"Kenya","KI":"Kiribati","KW":"Kuwait","KG":"Kyrgyzstan","LA":"Laos","LV":"Latvia","LB":"Lebanon","LS":"Lesotho","LR":"Liberia","LY":"Libya","LI":"Liechtenstein","LT":"Lithuania","LU":"Luxembourg","MO":"Macau","MG":"Madagascar","MW":"Malawi","MY":"Malaysia","MV":"Maldives","ML":"Mali","MT":"Malta","MH":"Marshall Islands","MR":"Mauritania","MU":"Mauritius","MX":"Mexico","FM":"Micronesia","MD":"Moldova","MC":"Monaco","MN":"Mongolia","ME":"Montenegro","MA":"Morocco","MZ":"Mozambique","MM":"Myanmar","NA":"Namibia","NR":"Nauru","NP":"Nepal","NL":"Netherlands","NZ":"New Zealand","NI":"Nicaragua","NE":"Niger","NG":"Nigeria","KP":"North Korea","MK":"North Macedonia","NO":"Norway","OM":"Oman","PK":"Pakistan","PW":"Palau","PS":"Palestine","PA":"Panama","PG":"Papua New Guinea","PY":"Paraguay","PE":"Peru","PH":"Philippines","PL":"Poland","PT":"Portugal","PR":"Puerto Rico","QA":"Qatar","RO":"Romania","RU":"Russia","RW":"Rwanda","KN":"Saint Kitts and Nevis","LC":"Saint Lucia","VC":"Saint Vincent and the Grenadines","WS":"Samoa","SM":"San Marino","ST":"Sao Tome and Principe","SA":"Saudi Arabia","SN":"Senegal","RS":"Serbia","SC":"Seychelles","SL":"Sierra Leone","SG":"Singapore","SK":"Slovakia","SI":"Slovenia","SB":"Solomon Islands","SO":"Somalia","ZA":"South Africa","KR":"South Korea","SS":"South Sudan","ES":"Spain","LK":"Sri Lanka","SD":"Sudan","SR":"Suriname","SE":"Sweden","CH":"Switzerland","SY":"Syria","TW":"Taiwan","TJ":"Tajikistan","TZ":"Tanzania","TH":"Thailand","TL":"Timor-Leste","TG":"Togo","TO":"Tonga","TT":"Trinidad and Tobago","TN":"Tunisia","TR":"Turkey","TM":"Turkmenistan","TV":"Tuvalu","UG":"Uganda","UA":"Ukraine","AE":"United Arab Emirates","GB":"United Kingdom","US":"United States","UY":"Uruguay","UZ":"Uzbekistan","VU":"Vanuatu","VA":"Vatican City","VE":"Venezuela","VN":"Vietnam","YE":"Yemen","ZM":"Zambia","ZW":"Zimbabwe"};
const THE = new Set(["US","GB","NL","AE","PH","BS","CZ","DO","CF","CD","GM","MH","SB"]);

const tg = window.Telegram && window.Telegram.WebApp;
// "unknown" means the page is open in a normal browser, not inside Telegram.
const inTelegram = !!(tg && tg.platform && tg.platform !== "unknown");
const qs = new URLSearchParams(location.search);
const num = (k, d) => { const v = parseFloat(qs.get(k)); return isNaN(v) ? d : v; };
const codes = (k, d) => (qs.get(k) || d).split(",").map(s => s.trim().toUpperCase()).filter(c => COUNTRIES[c]);
const PRICE = { res: num("res", 17.5), mob: num("mob", 45.5), idv: num("idv", 42), test: num("test", 0) };
const MOB = codes("mobc", "US,GB,CA,AU");
const TOP = codes("top", "US,GB,CA,DE,FR,AU");
const ALL = Object.keys(COUNTRIES).sort((a, b) => COUNTRIES[a].localeCompare(COUNTRIES[b]));

const $app = document.getElementById("app");
const $buy = document.getElementById("buyBtn");
const $toast = document.getElementById("toast");
const usd = n => "$" + n.toFixed(2);
const flag = cc => cc.replace(/./g, ch => String.fromCodePoint(0x1F1E6 + ch.charCodeAt(0) - 65));
const place = cc => (THE.has(cc) ? "the " : "") + COUNTRIES[cc];
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const tap = () => { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} };

const I = {
  mob: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 18v-3M10 18v-6M15 18V9M20 18V5"/></svg>`,
  res: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>`,
  idv: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.6-1.4 1.7-2 3-2s2.4.6 3 2M14 10h4M14 13h3"/></svg>`,
  test: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"/></svg>`,
  chat: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>`,
  chev: `<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>`,
  back: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>`,
  search: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>`,
  check: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>`,
};

let stack = [];
let buyAction = null;

function toast(msg) {
  $toast.textContent = msg; $toast.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => $toast.classList.remove("show"), 3200);
}

function setBuy(label, action) {
  buyAction = action;
  if (inTelegram) {
    if (label) { tg.MainButton.setParams({ text: label, color: "#5b8cff", text_color: "#ffffff" }); tg.MainButton.show(); }
    else tg.MainButton.hide();
  } else {
    $buy.textContent = label || "";
    $buy.style.display = label ? "block" : "none";
  }
}

function send(payload) {
  if (!inTelegram) return toast("Open this shop from the 🛍 Shop button in the bot to order.");
  try {
    tg.sendData(JSON.stringify(payload));   // closes the page; the bot continues in the chat
  } catch (e) {
    const msg = "Please open the shop with the 🛍 Shop button at the bottom of the bot chat to place an order.";
    try { tg.showAlert(msg); } catch (_) { toast(msg); }
  }
}

function go(view, ...args) { stack.push([view, args]); render(); }
function back() { if (stack.length > 1) { stack.pop(); render(); } }

function render() {
  const [view, args] = stack[stack.length - 1];
  setBuy(null);
  $app.innerHTML = `<div class="view">${VIEWS[view](...args)}</div>`;
  window.scrollTo(0, 0);
  if (inTelegram) stack.length > 1 ? tg.BackButton.show() : tg.BackButton.hide();
  if (AFTER[view]) AFTER[view](...args);
}

const bar = title => `<div class="bar">${inTelegram ? "" :
  `<button class="back" onclick="back()" aria-label="Back">${I.back}</button>`}<h2>${esc(title)}</h2></div>`;

const card = ({ icon, title, sub, price, note, onclick }) => `
  <button class="card" onclick="tap();${onclick}">
    <div class="ico">${icon}</div>
    <div class="body"><div class="t">${esc(title)}</div><div class="s">${esc(sub)}</div></div>
    ${price ? `<div class="p num"><b>${price}</b>${note ? `<span>${note}</span>` : ""}</div>` : ""}${I.chev}
  </button>`;

const tile = (kind, cc) => `<button class="tile" onclick="tap();go('detail','${kind}','${cc}')">
  <span class="f">${flag(cc)}</span><span class="n">${esc(COUNTRIES[cc])}</span></button>`;

function rows(list, grouped) {
  if (!list.length) return `<div class="empty">No country found. Try another name.</div>`;
  let html = "", letter = "", open = false;
  for (const cc of list) {
    const first = COUNTRIES[cc][0].toUpperCase();
    if (grouped && first !== letter) {
      if (open) html += `</div>`;
      html += `<div class="letter">${first}</div><div class="list">`; letter = first; open = true;
    } else if (!open) { html += `<div class="list">`; open = true; }
    html += `<button class="row" onclick="tap();go('detail','res','${cc}')"><span class="f">${flag(cc)}</span>
      <span class="n">${esc(COUNTRIES[cc])}</span>${I.chev}</button>`;
  }
  return html + (open ? `</div>` : "");
}

const ALIASES = { usa: "US", america: "US", uk: "GB", england: "GB", britain: "GB", uae: "AE",
  dubai: "AE", holland: "NL", korea: "KR", "ivory coast": "CI", czechia: "CZ" };
function search(q) {
  q = q.trim().toLowerCase();
  if (ALIASES[q]) return [ALIASES[q]];
  return ALL.filter(cc => COUNTRIES[cc].toLowerCase().includes(q) || cc.toLowerCase() === q);
}

const VIEWS = {
  home: () => `
    <div class="top"><div class="mark">A</div><div class="brand">${esc(SHOP.name)}<small>${esc(SHOP.tagline)}</small></div></div>
    <div class="hero"><h1>${esc(SHOP.headline)}</h1><p>${esc(SHOP.intro)}</p>
      <div class="stats">
        <div class="stat"><b class="num">${ALL.length}</b><span>Countries</span></div>
        <div class="stat"><b>USDT</b><span>BEP20</span></div>
        <div class="stat"><b>In chat</b><span>Delivery</span></div>
      </div></div>
    <div class="label">Proxies</div>
    ${card({ icon: I.mob, title: SHOP.names.mob, sub: `${SHOP.short.mob} · ${MOB.length} countries`,
             price: usd(PRICE.mob), onclick: "go('mob')" })}
    ${card({ icon: I.res, title: SHOP.names.res, sub: SHOP.short.res,
             price: usd(PRICE.res), onclick: "go('res')" })}
    <div class="label">Marketplace</div>
    ${card({ icon: I.idv, title: SHOP.names.idv, sub: SHOP.short.idv, price: usd(PRICE.idv), onclick: "go('detail','idv')" })}
    ${PRICE.test ? card({ icon: I.test, title: SHOP.names.test, sub: SHOP.short.test, price: usd(PRICE.test),
             onclick: "go('detail','test')" }) : ""}
    <div class="label">Help</div>
    ${card({ icon: I.chat, title: "Talk to support", sub: "Message the seller in chat", onclick: "send({a:'support'})" })}
    <p class="note">Prices in USD, paid in USDT (BEP20).</p>`,

  mob: () => `${bar(SHOP.names.mob)}
    <p class="lead">Choose a country · <span class="num">${usd(PRICE.mob)}</span> each</p>
    <div class="grid">${MOB.map(cc => tile("mob", cc)).join("")}</div>`,

  res: () => `${bar(SHOP.names.res)}
    <p class="lead">Available in any country · <span class="num">${usd(PRICE.res)}</span> each</p>
    <div class="search"><div class="field">${I.search}
      <input id="q" type="search" placeholder="Search any country" autocomplete="off" enterkeyhint="search"></div></div>
    <div id="results">
      <div class="label">Popular</div>
      <div class="grid">${TOP.map(cc => tile("res", cc)).join("")}</div>
      <div class="label">All countries</div>
      ${rows(ALL, true)}
    </div>`,

  detail: (kind, cc) => {
    const [intro, points] = SHOP.desc[kind](cc ? place(cc) : "");
    return `${bar(cc ? COUNTRIES[cc] : SHOP.names[kind])}
      <div class="product">
        <div class="badge">${cc ? flag(cc) : I[kind]}</div>
        <div><h1>${esc(SHOP.names[kind])}</h1><div class="sub">${cc ? esc(COUNTRIES[cc]) : esc(SHOP.short[kind])}</div></div>
      </div>
      <div class="price num"><b>${usd(PRICE[kind])}</b><span>paid in USDT (BEP20)</span></div>
      <div class="panel"><h3>About</h3><p>${esc(intro)}</p>
        ${points.map(p => `<div class="feat">${I.check}<span>${esc(p)}</span></div>`).join("")}</div>
      <div class="panel"><h3>How it works</h3><ol class="steps">
        <li><b>Tap Buy now.</b> Your order opens in the chat.</li>
        <li><b>Send ${usd(PRICE[kind])} in USDT</b> on BEP20, then paste your TxID.</li>
        <li><b>${kind === "idv" ? "Send your country and photo." : "Receive your proxy"}</b>
          ${kind === "idv" ? "The seller guides you through the rest." : "right in the chat."}</li>
      </ol></div>`;
  },
};

const AFTER = {
  res: () => {
    const $q = document.getElementById("q"), $r = document.getElementById("results");
    const full = $r.innerHTML;
    $q.addEventListener("input", () => {
      $r.innerHTML = $q.value.trim() ? `<div class="label">Results</div>${rows(search($q.value), false)}` : full;
    });
  },
  detail: (kind, cc) => setBuy(`Buy now · ${usd(PRICE[kind])}`, () => send({ a: "buy", k: kind, c: cc || null })),
};

$buy.addEventListener("click", () => buyAction && buyAction());
if (inTelegram) {
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor("#0b0d10"); tg.setBackgroundColor("#0b0d10"); tg.setBottomBarColor("#0b0d10"); } catch (e) {}
  tg.MainButton.onClick(() => buyAction && buyAction());
  tg.BackButton.onClick(back);
}
go("home");
</script>
</body>
</html>
